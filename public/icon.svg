<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="6" />

  <!-- Outer broadcast pulse rings -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="4" />

  <!-- Presentation Screen Display Card -->
  <g filter="url(#softShadow)">
    <rect x="80" y="100" width="352" height="230" rx="24" fill="#111827" stroke="url(#primaryGrad)" stroke-width="6" />
    
    <!-- Screen Header Bar -->
    <rect x="80" y="100" width="352" height="38" rx="20" fill="rgba(255, 255, 255, 0.06)" />
    <!-- Header Indicator dots -->
    <circle cx="106" cy="119" r="6" fill="#ef4444" />
    <circle cx="126" cy="119" r="6" fill="#f59e0b" />
    <circle cx="146" cy="119" r="6" fill="#10b981" />
    <!-- Live Badge -->
    <rect x="360" y="109" width="56" height="20" rx="6" fill="#ef4444" />
    <text x="388" y="123" fill="#ffffff" font-size="10" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">LIVE</text>

    <!-- Center Play/Presenter Symbol with vibrant gold accent -->
    <g filter="url(#glow)">
      <polygon points="230,170 310,215 230,260" fill="url(#accentGrad)" />
    </g>

    <!-- Subtitle / Lyric Waves under screen -->
    <rect x="130" y="285" width="130" height="12" rx="6" fill="rgba(255, 255, 255, 0.4)" />
    <rect x="270" y="285" width="110" height="12" rx="6" fill="url(#primaryGrad)" />
  </g>

  <!-- Screen Stand Base -->
  <path d="M236 330 L230 395 L282 395 L276 330 Z" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <rect x="176" y="395" width="160" height="18" rx="9" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Studio Pro / EasyStream Brand text -->
  <text x="256" y="455" fill="#f8fafc" font-size="28" font-weight="900" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    EASY<tspan fill="#38bdf8">PRESENTER</tspan>
  </text>
  <text x="256" y="480" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="4" font-family="system-ui, sans-serif" text-anchor="middle">
    STUDIO PRO
  </text>
</svg>
